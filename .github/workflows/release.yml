name: release

on:
  push:
    tags: ['v*']

# Prebuilt binaries so that trying this does not require a Go toolchain.
# Apple Silicon and Intel, because a Mac is either.
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: build
        run: |
          # Linux as well as macOS. The agent half needs macOS for launchd, the
          # window server and the keychain, but the automation half, the queue,
          # the board and the MCP server do not, and a Linux box running tmux
          # agents is a real thing to point this at.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "amac-$os-$arch" ./cmd/amac
            tar czf "amac-${GITHUB_REF_NAME}-$os-$arch.tar.gz" "amac-$os-$arch"
          done
          shasum -a 256 *.tar.gz > checksums.txt

      - name: release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "macOS binaries are unsigned, so the first run needs: xattr -d com.apple.quarantine amac-darwin-*" \
            *.tar.gz checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
