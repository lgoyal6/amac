<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="amac">
<meta name="theme-color" content="#0d0f13">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>amac</title>
<style>
  :root {
    --bg:#0d0f13; --card:#171a21; --card2:#1e222b; --line:#272c37;
    --fg:#e6e8ee; --dim:#8b93a7;
    --work:#4ea3ff; --idle:#8b93a7; --block:#ff8a3d; --end:#4b5162; --ok:#3ddc84;
    --fail:#ff5d5d;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#fff; --card2:#f0f2f6; --line:#e2e6ee;
            --fg:#12151b; --dim:#5d6577; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* .grid and .bar set display, which outranks the [hidden] attribute in the
     UA stylesheet. Without this the tab bar changes the underline and leaves
     the board on screen. */
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 ui-sans-serif,-apple-system,SF Pro Text,system-ui,sans-serif;
         padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           padding:14px 16px 0; border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; }
  h1 { font-size:17px; margin:0; letter-spacing:.02em; font-weight:650; }
  .conn { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--end); }
  .dot.on { background:var(--ok); }

  nav { display:flex; gap:2px; margin-top:11px; }
  nav button { background:none; border:none; border-bottom:2px solid transparent;
               color:var(--dim); font-size:14px; font-weight:600; padding:7px 12px 9px;
               border-radius:0; min-height:0; cursor:pointer; }
  nav button.on { color:var(--fg); border-bottom-color:var(--work); }
  nav .badge.ready { background:var(--work); color:#03121f; }
  nav .badge { display:inline-block; min-width:17px; margin-left:5px; padding:0 5px;
               border-radius:999px; background:var(--block); color:#1a0d04;
               font-size:11px; font-weight:700; }

  main { padding:14px 16px 90px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:13px 14px; }
  .card.blocked { border-color:var(--block); }
  .card > .top { cursor:pointer; }
  .top { display:flex; align-items:center; gap:8px; }
  .name { font-weight:620; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .agent { font-size:11px; color:var(--dim); border:1px solid var(--line);
           padding:1px 6px; border-radius:999px; flex:none; }
  .state { margin-left:auto; font-size:11px; text-transform:uppercase;
           letter-spacing:.06em; font-weight:640; flex:none; }
  .state.working{color:var(--work)} .state.idle{color:var(--idle)}
  .state.blocked{color:var(--block)} .state.ended{color:var(--end)}
  .state.starting{color:var(--work)} .state.unknown{color:var(--end)}
  .detail { color:var(--dim); font-size:13px; margin-top:5px;
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kind { font-size:11px; padding:1px 6px; border-radius:3px; flex:none;
          background:var(--card2); color:var(--dim); }
  .kind.on { background:#1d3226; color:#6fcf97; }
  .dir { color:var(--dim); font-size:11px; margin-top:6px; font-family:ui-monospace,SFMono-Regular,monospace;
         overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .ask { margin-top:11px; padding-top:11px; border-top:1px solid var(--line); }
  .ask-title { font-size:13px; margin-bottom:9px; }
  .opts { display:flex; gap:7px; flex-wrap:wrap; }
  button { font:inherit; font-size:13px; font-weight:560; padding:9px 13px;
           border-radius:9px; border:1px solid var(--line); background:var(--card2);
           color:var(--fg); cursor:pointer; min-height:40px; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; }
  button.allow { background:var(--ok); border-color:var(--ok); color:#04140a; }
  button.reject { background:transparent; color:var(--block); border-color:var(--block); }
  button.sm { min-height:34px; padding:6px 10px; font-size:12.5px; }
  button.go { background:var(--work); border-color:var(--work); color:#03121f; }

  /* The pane mirror. Not a parse of the terminal: the bytes, forwarded, for a
     human to read exactly as `tmux attach` would show them. */
  .pane { margin-top:11px; background:#0a0c10; border:1px solid var(--line);
          border-radius:9px; padding:9px 10px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
          font-size:11px; line-height:1.35; color:#c9cfdd; white-space:pre;
          overflow:auto; max-height:270px; }
  @media (prefers-color-scheme: light) { .pane { background:#0d0f13; } }
  .keys { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .typebar { display:flex; gap:6px; margin-top:8px; }
  .typebar input { flex:1; min-width:0; font:inherit; font-size:14px; padding:9px 10px;
                   border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--fg); }
  .note { color:var(--dim); font-size:11.5px; margin-top:7px; }

  .log { margin-top:11px; padding-top:11px; border-top:1px solid var(--line);
         font-family:ui-monospace,SFMono-Regular,monospace; font-size:11.5px;
         color:var(--dim); max-height:200px; overflow-y:auto; }
  .log div { padding:1.5px 0; word-break:break-word; }
  .empty { color:var(--dim); text-align:center; padding:44px 16px; grid-column:1/-1; }

  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--card);
         border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom));
         display:flex; gap:8px; }
  .bar select, .bar input { font:inherit; font-size:14px; padding:9px 10px; border-radius:9px;
         border:1px solid var(--line); background:var(--card2); color:var(--fg); }
  .bar input { flex:1; min-width:0; }

  /* crew */
  .compose { background:var(--card); border:1px solid var(--line); border-radius:14px;
             padding:13px 14px; margin-bottom:14px; display:grid; gap:8px; }
  .compose input, .compose select { font:inherit; font-size:14px; padding:9px 10px; border-radius:9px;
             border:1px solid var(--line); background:var(--card2); color:var(--fg); width:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  /* minmax(0,1fr), not the default: a grid track sizes to max-content, so a
     long session name made the row wider than the card it sits in and pushed
     the state off the right edge. */
  .chain { display:grid; grid-template-columns:minmax(0,1fr); gap:7px; margin-top:10px; }
  .role { display:flex; align-items:center; gap:9px; background:var(--card2); min-width:0;
          border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13.5px; }
  .role .n { color:var(--dim); font-size:12px; width:14px; flex:none; }
  .role .rn { font-weight:620; width:74px; flex:none; }
  .role .ra { color:var(--dim); font-size:12px; width:52px; flex:none; }
  .role .rs { margin-left:auto; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
              font-weight:640; flex:none; }
  .rs.running{color:var(--work)} .rs.done{color:var(--ok)}
  .rs.waiting{color:var(--dim)} .rs.ready{color:var(--block)}
  .art { margin-top:9px; background:#0a0c10; border:1px solid var(--line); border-radius:9px;
         padding:10px 11px; font-family:ui-monospace,SFMono-Regular,monospace; font-size:11.5px;
         color:#c9cfdd; white-space:pre-wrap; max-height:320px; overflow:auto; }
  .size { font-size:11px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; color:var(--dim); }

  .acts { display:flex; gap:7px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .acts .said { margin:0; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           gap:12px; margin-bottom:14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 15px; }
  .tv { font-size:26px; font-weight:660; letter-spacing:-.01em; }
  .tl { color:var(--dim); font-size:12px; margin-top:3px; }

  .bar-row { display:flex; align-items:center; gap:9px; padding:4px 0; }
  .bar-name { width:38%; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { flex:1; height:8px; background:var(--card2); border-radius:999px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--work); border-radius:999px; }
  .bar-val { width:64px; text-align:right; font-size:12.5px; color:var(--dim);
             font-variant-numeric:tabular-nums; }

  /* health */
  .hrow { display:flex; align-items:baseline; gap:9px; padding:11px 0; border-bottom:1px solid var(--line); }
  .hrow:last-child { border-bottom:none; }
  .hstate { font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700;
            width:66px; flex:none; }
  .hstate.ok{color:var(--ok)} .hstate.failing{color:var(--fail)}
  .hstate.late{color:var(--block)} .hstate.unknown{color:var(--dim)}
  .hname { font-weight:600; font-size:14px; }
  .hdetail { color:var(--dim); font-size:12.5px; margin-top:3px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>amac</h1>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">connecting</span></div>
  </div>
  <nav>
    <button data-tab="board" class="on">board<span class="badge" id="blockedCount" hidden></span></button>
    <button data-tab="queue">queue<span class="badge ready" id="readyCount" hidden></span></button>
    <button data-tab="crew">crew</button>
    <button data-tab="health">health</button>
    <button data-tab="spend">spend</button>
  </nav>
</header>

<main>
  <div id="board" class="grid"><div class="empty">no sessions yet</div></div>

  <section id="queue" hidden>
    <div class="compose">
      <input id="taskTitle" placeholder="what needs doing?" enterkeyhint="go">
      <input id="taskDir" placeholder="working directory (default: home)">
      <div class="row">
        <button id="taskFile" class="sm">file it</button>
        <button id="taskClaim" class="sm go">claim next and open a session</button>
        <span class="hdetail" id="taskSaid"></span>
      </div>
    </div>
    <div id="queueOut"></div>
  </section>

  <section id="crew" hidden>
    <div class="compose">
      <input id="crewTask" placeholder="what should the org do?" enterkeyhint="go">
      <input id="crewDir" placeholder="working directory (default: home)">
      <div class="row">
        <select id="crewSize">
          <option value="">triage it</option>
          <option value="solo">solo</option>
          <option value="pair">pair</option>
          <option value="team">team</option>
        </select>
        <button id="crewPlan" class="sm">plan</button>
        <button id="crewOpen" class="sm go">open next role</button>
      </div>
      <div id="crewPlanOut"></div>
    </div>
    <div id="crewRuns"></div>
  </section>

  <section id="health" hidden>
    <div class="card"><div id="healthOut" class="empty">loading</div></div>
  </section>

  <section id="spend" hidden>
    <div id="spendOut" class="empty">loading</div>
  </section>
</main>

<div class="bar" id="startBar">
  <select id="agent"></select>
  <input id="prompt" placeholder="start a session..." enterkeyhint="go">
</div>

<script>
// The token rides in the URL because EventSource cannot set headers. Stash it
// so a refresh or a home-screen bookmark keeps working, then strip it from the
// address bar so it does not sit in screenshots or shoulder-view.
const url = new URL(location.href);
if (url.searchParams.get('token')) {
  localStorage.setItem('amac_token', url.searchParams.get('token'));
  history.replaceState({}, '', url.pathname);
}
const TOKEN = localStorage.getItem('amac_token') || '';

const $ = id => document.getElementById(id);
// Every API route needs the token, and a device that does not have one gets a
// page with working chrome and nothing in it. The only feedback used to be the
// connection pill saying "reconnecting", which points at the network and not at
// the actual problem: opening the dashboard by hostname instead of from the
// link that carries the token. An empty board and an unauthorised board looked
// identical, which is the same failure this system keeps finding elsewhere.
let unauthorized = false;

const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'X-Amac-Token': TOKEN, ...(opts.headers || {}) },
  });
  if (r.status === 401 && !unauthorized) {
    unauthorized = true;
    showUnauthorized();
  }
  return r;
};

function showUnauthorized() {
  $('dot').classList.remove('on');
  $('connText').textContent = 'no token';
  const msg = TOKEN
    ? 'The token this device has was rejected. It may have been rotated on the Mac.'
    : 'This device has no token, so every API call is refused.';
  document.querySelector('main').innerHTML = `
    <div class="card" style="max-width:520px;margin:0 auto">
      <div class="top"><span class="name">not authorised</span></div>
      <div class="detail" style="white-space:normal">${esc(msg)}</div>
      <div class="detail" style="white-space:normal;margin-top:9px">
        Open the dashboard from the full link, which carries the token once and
        stores it on this device:
      </div>
      <div class="pane" style="white-space:pre-wrap">${esc(location.origin)}/?token=&lt;token&gt;</div>
      <div class="detail" style="white-space:normal;margin-top:9px">
        On the Mac: <code>cat ~/.amac/token</code>, or run <code>amac daemon</code>
        and it prints the whole link.
      </div>
    </div>`;
  // Nothing below this point can succeed, and a page that keeps retrying while
  // showing an explanation is a page that will overwrite the explanation.
  clearInterval(refreshLoop);
  if (stream) stream.close();
}
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };

function ago(iso) {
  const secs = (Date.now() - new Date(iso)) / 1000;
  if (!isFinite(secs) || secs < 0) return '';
  if (secs < 90) return 'just now';
  const mins = Math.round(secs / 60);
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  return hrs < 48 ? hrs + 'h ago' : Math.round(hrs / 24) + 'd ago';
}

let sessions = new Map();
let logs = new Map();      // session id -> recent lines
let open = new Set();      // expanded cards
let panes = new Map();     // session id -> last captured pane text
let paneEls = new Map();   // session id -> the <div class="pane"> showing it
let lastSeq = 0;
let tab = 'board';
// Expanding a blocked card is done for you once, on the first sight of it.
// Answering the question you have not answered is the entire job of the
// screen, and making you tap twice to see it is the screen failing at it.
let autoOpened = new Set();

// ------------------------------------------------------------------ board --

// The stream replays up to 500 events on connect and an active turn emits
// hundreds more. One list fetch per event is a flood the page inflicts on
// itself, so both the fetch and the paint coalesce onto the next tick.
let refreshTimer = null, renderTimer = null;
function scheduleRefresh() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; refresh(); }, 250);
}
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; if (tab === 'board') render(); }, 250);
}

async function refresh() {
  if (unauthorized) return;
  const r = await api('/api/sessions');
  if (!r.ok) return;
  const list = await r.json();
  sessions = new Map(list.map(s => [s.id, s]));
  // Only the first one. Five blocked sessions each expanded to a full pane is
  // a page you have to scroll past to reach anything else, and the sort
  // already guarantees the one opened for you is the one on top.
  const blockedIds = list.filter(s => s.state === 'blocked').map(s => s.id).sort();
  if (blockedIds.length && !autoOpened.has(blockedIds[0])) {
    autoOpened.add(blockedIds[0]);
    open.add(blockedIds[0]);
  }
  for (const s of list) if (s.state !== 'blocked') autoOpened.delete(s.id);
  const blocked = list.filter(s => s.state === 'blocked').length;
  const badge = $('blockedCount');
  badge.hidden = blocked === 0;
  badge.textContent = blocked;
  if (tab === 'board') render();
}

function push(id, line) {
  if (!id) return;
  const arr = logs.get(id) || [];
  arr.push(line);
  // Bounded on purpose: a long turn emits thousands of updates and a phone
  // should not hold all of them in the DOM.
  if (arr.length > 60) arr.shift();
  logs.set(id, arr);
}

function render() {
  const grid = $('board');
  const all = [...sessions.values()];
  if (!all.length) { grid.innerHTML = '<div class="empty">no sessions yet</div>'; return; }

  // Anything waiting on a human sorts first. That is the whole point of the
  // screen: the question you have not answered should never be below the fold.
  const rank = s => s.state === 'blocked' ? 0 : s.state === 'working' ? 1 : s.state === 'idle' ? 2 : 3;
  all.sort((a, b) => rank(a) - rank(b) || a.id.localeCompare(b.id));

  grid.innerHTML = '';
  for (const s of all) grid.appendChild(cardFor(s));
}

function cardFor(s) {
  const card = document.createElement('div');
  card.className = 'card' + (s.state === 'blocked' ? ' blocked' : '');

  const head = document.createElement('div');
  head.className = 'top';
  head.innerHTML = `<span class="name">${esc(s.id)}</span>
    <span class="agent">${esc(s.agent || 'shell')}</span>
    ${s.kind === 'tmux' ? '<span class="kind">tmux</span>' : ''}
    ${s.attached ? '<span class="kind on">attached</span>' : ''}
    <span class="state ${esc(s.state)}">${esc(s.state)}</span>`;
  head.onclick = () => { open.has(s.id) ? open.delete(s.id) : open.add(s.id); render(); };
  card.appendChild(head);

  const d = document.createElement('div');
  d.className = 'detail';
  // How old the evidence is, on the same line as what it claims. For a session
  // amac only watches there is nothing that refutes a state afterwards, so
  // "blocked" alone asserts more about right now than amac can support.
  d.textContent = [s.detail, s.since ? ago(s.since) : ''].filter(Boolean).join(' \u00b7 ');
  card.appendChild(d);

  // An ACP session amac started reports its own options over the protocol, so
  // these buttons mean exactly what they say.
  if (s.pending) {
    const ask = document.createElement('div');
    ask.className = 'ask';
    ask.innerHTML = `<div class="ask-title">${esc(s.pending.title)}</div>`;
    const opts = document.createElement('div');
    opts.className = 'opts';
    for (const o of s.pending.options) {
      const b = document.createElement('button');
      b.textContent = o.name;
      if (o.kind && o.kind.startsWith('allow')) b.className = 'allow';
      if (o.kind && o.kind.startsWith('reject')) b.className = 'reject';
      b.onclick = async ev => {
        ev.stopPropagation();
        b.disabled = true;
        await api(`/api/sessions/${encodeURIComponent(s.id)}/answer`,
          { method: 'POST', body: JSON.stringify({ optionId: o.optionId }) });
        refresh();
      };
      opts.appendChild(b);
    }
    ask.appendChild(opts);
    card.appendChild(ask);
  }

  if (open.has(s.id)) {
    const dir = document.createElement('div');
    dir.className = 'dir';
    dir.textContent = s.dir || '';
    card.appendChild(dir);

    if (s.kind === 'tmux') card.appendChild(remote(s));
    card.appendChild(inspect(s));

    const log = document.createElement('div');
    log.className = 'log';
    for (const line of (logs.get(s.id) || [])) {
      const el = document.createElement('div');
      el.textContent = line;
      log.appendChild(el);
    }
    if (log.childNodes.length) {
      card.appendChild(log);
      requestAnimationFrame(() => { log.scrollTop = log.scrollHeight; });
    }
  }
  return card;
}

// remote is the screen, forwarded, plus the keys that go back.
//
// amac never reads this text. It does not know which option is which, and it
// deliberately does not try: a row of Allow/Deny buttons over a pane it had
// parsed would be a positional guess, and an approval sent to the wrong option
// is worse than no button at all. You read the options; amac types the key.
function remote(s) {
  const wrap = document.createElement('div');

  const pre = document.createElement('div');
  pre.className = 'pane';
  const cached = panes.get(s.id);
  pre.textContent = cached === undefined ? 'reading the pane...' : (cached || '(nothing on the screen)');
  wrap.appendChild(pre);
  // The node is registered rather than re-found, because a capture must update
  // this one element and never re-render the board. Rendering rebuilds the
  // pane, which would capture again: the first version of this looped until
  // the browser ran out of sockets.
  paneEls.set(s.id, pre);
  requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
  if (cached === undefined) capture(s.id);

  const keys = document.createElement('div');
  keys.className = 'keys';
  const send = async body => {
    const r = await api(`/api/sessions/${encodeURIComponent(s.id)}/keys`,
      { method: 'POST', body: JSON.stringify(body) });
    if (!r.ok) { pre.textContent = 'send failed: ' + (await r.text()); return; }
    const v = await r.json();
    panes.set(s.id, v.text);
    pre.textContent = v.text;
    pre.scrollTop = pre.scrollHeight;
  };
  const key = (label, body) => {
    const b = document.createElement('button');
    b.className = 'sm';
    b.textContent = label;
    b.onclick = ev => { ev.stopPropagation(); send(body); };
    keys.appendChild(b);
  };
  // Numbers first: every agent CLI on this machine numbers its options, and
  // pressing the number you can see on the screen above is the whole gesture.
  for (const n of ['1', '2', '3']) key(n, { text: n });
  key('enter', { key: 'Enter' });
  key('esc', { key: 'Escape' });
  key('^C', { key: 'C-c' });
  key('up', { key: 'Up' });
  key('down', { key: 'Down' });
  key('refresh', {});
  keys.lastChild.onclick = ev => { ev.stopPropagation(); capture(s.id); };
  wrap.appendChild(keys);

  const bar = document.createElement('div');
  bar.className = 'typebar';
  const input = document.createElement('input');
  input.placeholder = 'type into ' + s.id;
  input.enterKeyHint = 'send';
  const go = document.createElement('button');
  go.className = 'sm go';
  go.textContent = 'send';
  const fire = ev => {
    ev.stopPropagation();
    const text = input.value;
    if (!text) return;
    input.value = '';
    send({ text, enter: true });
  };
  input.onkeydown = ev => { if (ev.key === 'Enter') fire(ev); };
  go.onclick = fire;
  bar.append(input, go);
  wrap.appendChild(bar);

  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'keys go straight into the pane, exactly as if you had typed them there';
  wrap.appendChild(note);
  return wrap;
}

// The pane shows what an agent is saying; the diff shows what it has done, and
// an agent that says it fixed the bug looks identical in a terminal to one that
// has. Read-only, and confined to the session's own directory.
function inspect(s) {
  const wrap = document.createElement('div');
  const bar = document.createElement('div');
  bar.className = 'keys';
  const out = document.createElement('div');
  out.className = 'pane';
  out.hidden = true;

  const show = (text) => { out.hidden = false; out.textContent = text; };
  const btn = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'sm';
    b.textContent = label;
    b.onclick = async ev => { ev.stopPropagation(); b.disabled = true; await fn(); b.disabled = false; };
    bar.appendChild(b);
  };

  btn('diff', async () => {
    const r = await api(`/api/sessions/${encodeURIComponent(s.id)}/diff`);
    if (!r.ok) return show('could not read it');
    const d = await r.json();
    if (!d.repo) return show(d.diff);
    const body = (d.status || '').trim() + '\n\n' + (d.diff || '').trim();
    show(body.trim() ? `on ${d.branch}\n\n${body}` : `on ${d.branch}: nothing uncommitted`);
  });

  btn('files', async () => {
    await browse(s.id, '', show);
  });

  wrap.append(bar, out);
  return wrap;
}

async function browse(id, path, show) {
  const r = await api(`/api/sessions/${encodeURIComponent(id)}/files?path=${encodeURIComponent(path)}`);
  if (!r.ok) return show('could not read it');
  const d = await r.json();
  const lines = d.entries.map(e => (e.dir ? 'd ' : '  ') + e.name + (e.dir ? '/' : ` (${e.size}b)`));
  show((path || '.') + '\n' + (lines.join('\n') || '(empty)'));
}

async function capture(id) {
  const r = await api(`/api/sessions/${encodeURIComponent(id)}/pane`);
  if (!r.ok) return;
  const v = await r.json();
  panes.set(id, v.text);
  const el = paneEls.get(id);
  if (!el || !el.isConnected) return;
  // Only touch the DOM when the bytes changed. An idle pane captured every
  // four seconds would otherwise reset the scroll position of a screen someone
  // is in the middle of reading.
  if (el.textContent !== v.text) {
    el.textContent = v.text || '(nothing on the screen)';
    el.scrollTop = el.scrollHeight;
  }
}

// Only the open cards are polled, and only on the board. Twenty sessions
// captured on a timer would be twenty forks a tick for panes nobody is looking
// at.
setInterval(() => {
  if (tab !== 'board' || document.hidden) return;
  for (const id of open) {
    const s = sessions.get(id);
    if (s && s.kind === 'tmux') capture(id);
  }
}, 4000);

// ------------------------------------------------------------------- crew --

function chainHTML(plan) {
  if (!plan.roles) return '';
  const rows = plan.roles.map((r, i) => `
    <div class="role" data-role="${esc(r.role)}" data-slug="${esc(plan.slug)}">
      <span class="n">${i + 1}</span>
      <span class="rn">${esc(r.role)}</span>
      <span class="ra">${esc(r.agent)}</span>
      <span class="detail" style="margin:0;flex:1;min-width:0">${r.bytes ? esc(r.role) + '.md · ' + r.bytes + 'B' : esc(r.session)}</span>
      <span class="rs ${esc(r.state)}">${esc(r.state)}</span>
    </div>`).join('');
  return `<div class="row" style="margin-top:10px;align-items:center">
            <span class="size">${esc(plan.size)}</span>
            <span class="detail" style="margin:0">${esc(plan.reason || plan.runDir)}</span>
          </div>
          <div class="chain">${rows}</div>`;
}

// Clicking a finished role shows what it handed on. The artifact is the
// handoff, so reading it is how you check the chain before letting it run.
function wireChain(root, plan) {
  root.querySelectorAll('.role').forEach(el => {
    el.onclick = async () => {
      const existing = el.nextElementSibling;
      if (existing && existing.classList.contains('art')) { existing.remove(); return; }
      const r = await api(`/api/crew/artifact?slug=${encodeURIComponent(el.dataset.slug)}&role=${encodeURIComponent(el.dataset.role)}`);
      const art = document.createElement('div');
      art.className = 'art';
      art.textContent = r.ok ? (await r.json()).text : 'nothing written yet';
      el.after(art);
    };
  });
}

let currentPlan = null;

async function crewPlan(openNext) {
  const task = $('crewTask').value.trim();
  if (!task) return;
  const body = { task, dir: $('crewDir').value.trim(), size: $('crewSize').value };
  const out = $('crewPlanOut');
  out.innerHTML = '<div class="detail" style="margin-top:10px">grading the task...</div>';
  const r = await api(openNext ? '/api/crew/open' : '/api/crew/plan',
    { method: 'POST', body: JSON.stringify(body) });
  if (!r.ok) {
    out.innerHTML = `<div class="detail" style="margin-top:10px">${esc((await r.json()).error)}</div>`;
    return;
  }
  currentPlan = await r.json();
  out.innerHTML = chainHTML(currentPlan);
  wireChain(out, currentPlan);
  loadRuns();
}

async function loadRuns() {
  const r = await api('/api/crew');
  if (!r.ok) return;
  const runs = await r.json();
  const el = $('crewRuns');
  if (!runs.length) { el.innerHTML = '<div class="empty">no runs yet</div>'; return; }
  el.innerHTML = '';
  for (const run of runs) {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '12px';
    card.innerHTML = `<div class="top"><span class="name">${esc(run.task)}</span></div>` + chainHTML(run);
    wireChain(card, run);
    el.appendChild(card);
  }
}

$('crewPlan').onclick = () => crewPlan(false);
$('crewOpen').onclick = () => crewPlan(true);
$('crewTask').addEventListener('keydown', ev => { if (ev.key === 'Enter') crewPlan(false); });

// ----------------------------------------------------------------- health --

async function loadHealth() {
  const r = await api('/api/health');
  const el = $('healthOut');
  if (!r.ok) { el.className = 'empty'; el.textContent = 'could not read the sweep'; return; }
  const { at, reports } = await r.json();
  if (!reports || !reports.length) {
    el.className = 'empty';
    el.textContent = 'no sweep recorded yet';
    return;
  }
  el.className = '';
  el.innerHTML = reports.map(rep => `
    <div class="hrow">
      <span class="hstate ${esc(rep.state)}">${esc(rep.state)}</span>
      <div style="min-width:0;flex:1">
        <div class="hname">${esc(rep.name)}</div>
        <div class="hdetail">${esc(rep.detail)}</div>
        ${(rep.notes || []).map(n => `<div class="hdetail">${esc(n)}</div>`).join('')}
        ${rep.home ? `<div class="acts">
             <button class="sm fix" data-name="${esc(rep.name)}">fix it</button>
             <button class="sm shell" data-name="${esc(rep.name)}">shell</button>
             <span class="hdetail said"></span>
           </div>` : ''}
      </div>
    </div>`).join('')
    + `<div class="hdetail" style="margin-top:12px">swept ${esc(new Date(at).toLocaleString())}</div>`;

  // "fix it" hands the finding to the org: it is graded, the chain is laid out,
  // and the first role opens as a session you can take over. The brief is built
  // on the server from what the sweep actually saw, so it says the same thing
  // whoever pressed the button.
  el.querySelectorAll('button.fix').forEach(b => {
    b.onclick = () => dispatch(b, 'fix', b.dataset.name);
  });
  el.querySelectorAll('button.shell').forEach(b => {
    b.onclick = () => dispatch(b, 'shell', b.dataset.name);
  });
}

async function dispatch(btn, what, name) {
  const said = btn.parentElement.querySelector('.said');
  btn.disabled = true;
  said.textContent = what === 'fix' ? 'grading the task...' : 'opening...';
  const r = await api(`/api/health/${encodeURIComponent(name)}/${what}`, { method: 'POST' });
  const body = await r.json();
  btn.disabled = false;
  if (!r.ok) { said.textContent = body.error || 'failed'; return; }
  if (what === 'shell') {
    said.textContent = body.attach;
    return;
  }
  const next = (body.roles || []).find(x => x.state === 'running');
  said.textContent = next
    ? `${body.size}: ${next.role} open on ${next.agent} (${next.session})`
    : `${body.size} planned`;
  refresh();
}

// ------------------------------------------------------------------ queue --

// The board never finishes work on a worker's behalf. A task is done when the
// thing doing it says so, and a button that closed a task the moment a session
// opened would be reporting an intention as a result. What it offers instead is
// the fencing token, because every later call needs it and nobody can guess it.
async function loadQueue() {
  const r = await api('/api/tasks');
  if (!r.ok) return;
  const list = await r.json();
  const el = $('queueOut');

  const ready = list.filter(t => t.state === 'ready').length;
  const badge = $('readyCount');
  badge.hidden = ready === 0;
  badge.textContent = ready;

  if (!list.length) { el.className = 'empty'; el.textContent = 'nothing queued'; return; }
  el.className = 'card';
  el.innerHTML = list.map(t => `
    <div class="hrow">
      <span class="hstate ${esc(qstate(t))}">${esc(t.state)}</span>
      <div style="min-width:0;flex:1">
        <div class="hname">${esc(t.title)}</div>
        <div class="hdetail">${esc(t.dir || '')}</div>
        ${t.state === 'claimed' ? `<div class="hdetail">${esc(t.owner)} · token ${t.token} · lease ${ago(t.lease)}</div>` : ''}
        ${t.attempt > 1 ? `<div class="hdetail">attempt ${t.attempt}: earlier ones did not finish</div>` : ''}
        ${t.result ? `<div class="hdetail">${esc(t.result)}</div>` : ''}
        ${t.state === 'claimed' ? `<div class="acts">
            <button class="sm" data-id="${esc(t.id)}" data-token="${t.token}" data-state="done">done</button>
            <button class="sm" data-id="${esc(t.id)}" data-token="${t.token}" data-state="released">release</button>
          </div>` : ''}
      </div>
    </div>`).join('');

  el.querySelectorAll('.acts button').forEach(b => {
    b.onclick = async () => {
      b.disabled = true;
      const r = await api(`/api/tasks/${encodeURIComponent(b.dataset.id)}/finish`, {
        method: 'POST',
        body: JSON.stringify({ token: Number(b.dataset.token), state: b.dataset.state }),
      });
      if (!r.ok) $('taskSaid').textContent = (await r.json()).error;
      loadQueue();
    };
  });
}

// A task's state is not a health verdict, but the same four colours read the
// same way at a glance, which is worth more than a fifth vocabulary.
const qstate = t => ({ ready: 'late', claimed: 'ok', done: 'ok', failed: 'failing', canceled: 'unknown' })[t.state] || 'unknown';

async function fileTask() {
  const title = $('taskTitle').value.trim();
  if (!title) return;
  const r = await api('/api/tasks', {
    method: 'POST',
    body: JSON.stringify({ title, dir: $('taskDir').value.trim() }),
  });
  $('taskSaid').textContent = r.ok ? 'filed' : (await r.json()).error;
  if (r.ok) $('taskTitle').value = '';
  loadQueue();
}

async function claimNext() {
  $('taskSaid').textContent = 'claiming...';
  const r = await api('/api/tasks/claim', { method: 'POST', body: JSON.stringify({ owner: 'board' }) });
  const d = await r.json();
  $('taskSaid').textContent = r.ok ? d.attach : d.error;
  loadQueue();
  refresh();
}

$('taskFile').onclick = fileTask;
$('taskClaim').onclick = claimNext;
$('taskTitle').addEventListener('keydown', ev => { if (ev.key === 'Enter') fileTask(); });

// ------------------------------------------------------------------ spend --

// Read from looseapi rather than recomputed. amac can only see the sessions it
// started and only prices what an adapter reported; looseapi reads both CLIs'
// logs whoever started them, plus the billing mail that is the only source for
// a credit balance falling to zero.
// A share bar rather than a number alone. The useful thing about a breakdown on
// a phone is which two or three lines dominate, and that reads off a length in
// one glance and off a column of figures in several.
function bars(title, rows) {
  if (!rows || !rows.length) return '';
  return `<div class="card" style="margin-bottom:12px">
    <div class="hdetail" style="margin-bottom:9px">${esc(title)}</div>
    ${rows.map(r => `
      <div class="bar-row">
        <div class="bar-name">${esc(r.name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(r.share, 1)}%"></div></div>
        <div class="bar-val">${esc(usd(r.cents))}</div>
      </div>`).join('')}
  </div>`;
}

// Matches the server's formatter: no false precision, and never rounded to zero
// when there is real money in it.
const usd = c => c === 0 ? '$0' : c < 100 ? `$${(c / 100).toFixed(2)}`
  : c < 100000 ? `$${Math.round(c / 100)}` : `$${Math.round(c / 100).toLocaleString()}`;

async function loadSpend() {
  const el = $('spendOut');
  const r = await api('/api/spend');
  const d = r.ok ? await r.json() : { error: 'could not read the snapshot' };
  if (d.error) { el.className = 'empty'; el.textContent = d.error; return; }
  el.className = '';
  el.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="tv">${esc(d.monthlyUsd)}</div><div class="tl">recurring / month</div></div>
      <div class="tile"><div class="tv">${esc(d.todayUsd)}</div><div class="tl">agents today</div></div>
      <div class="tile"><div class="tv">${esc(d.agentUsd)}</div><div class="tl">agents, ${d.days}d</div></div>
    </div>
    ${bars('where it went', d.byProject)}
    ${bars('what ran it', d.byModel)}
    <div class="card">
      ${d.alerts && d.alerts.length
        ? d.alerts.map(a => `<div class="hrow">
             <span class="hstate ${a.severity >= 3 ? 'failing' : 'late'}">${a.severity >= 3 ? 'act' : 'watch'}</span>
             <div style="min-width:0"><div class="hdetail">${esc(a.message)}</div></div>
           </div>`).join('')
        : '<div class="hdetail">nothing to act on</div>'}
      <div class="hdetail" style="margin-top:12px">
        scanned ${esc(new Date(d.at).toLocaleString())}${d.stale ? ' - stale, the daily scan has not run' : ''}
      </div>
      <div class="hdetail">${esc(d.caveat)}</div>
    </div>`;
}

// ------------------------------------------------------------------- tabs --

document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    for (const id of ['board', 'queue', 'crew', 'health', 'spend']) $(id).hidden = id !== tab;
    $('startBar').hidden = tab !== 'board';
    if (tab === 'board') render();
    if (tab === 'queue') loadQueue();
    if (tab === 'crew') loadRuns();
    if (tab === 'health') loadHealth();
    if (tab === 'spend') loadSpend();
  };
});

// ------------------------------------------------------------------ stream --

let stream = null;
let refreshLoop = null;

function connect() {
  // No token at all: say so without a round trip that can only 401.
  if (!TOKEN) { unauthorized = true; showUnauthorized(); return; }
  const es = new EventSource(`/api/stream?since=${lastSeq}&token=${encodeURIComponent(TOKEN)}`);
  stream = es;

  es.onopen = () => { $('dot').classList.add('on'); $('connText').textContent = 'live'; };
  es.onerror = () => {
    if (unauthorized) { es.close(); return; }
    $('dot').classList.remove('on');
    $('connText').textContent = 'reconnecting';
    // EventSource retries on its own and replays from Last-Event-ID, so there
    // is nothing to do here but let it.
  };

  es.onmessage = ev => {
    const e = JSON.parse(ev.data);
    lastSeq = Math.max(lastSeq, e.seq);
    let p = {};
    try { p = e.payload ? (typeof e.payload === 'string' ? JSON.parse(e.payload) : e.payload) : {}; } catch {}

    if (e.kind === 'session.update') {
      if (p.text) push(e.session, p.text);
      else if (p.title) push(e.session, `[${p.update || 'tool'}] ${p.title}`);
      else if (p.prompt) push(e.session, `> ${p.prompt}`);
      else if (p.state) push(e.session, `-- ${p.state}${p.detail ? ': ' + p.detail : ''}`);
    } else if (e.kind === 'permission.requested') {
      push(e.session, `?? ${p.title}`);
    } else if (e.kind === 'permission.answered') {
      push(e.session, `<< ${p.outcome} ${p.optionId || ''}`);
    } else if (e.kind === 'actuation') {
      push(e.session, `[${p.op}] ${p.sent || p.path || ''}`);
    } else if (e.kind === 'session.state') {
      push(e.session, `-- ${p.state}${p.detail ? ': ' + p.detail : ''}`);
    } else if (e.kind === 'attention') {
      push(e.session, `!! ${p.outcome && p.outcome.sent ? 'notified' : 'held: ' + ((p.outcome || {}).why || '')}`);
    }

    // Anything that can change the card list re-reads the authoritative list
    // rather than trying to mutate it from the event.
    const listChanged = ['session.state', 'session.started', 'session.ended', 'attention'].includes(e.kind)
      || (e.kind === 'session.update' && p.state);
    if (listChanged) scheduleRefresh();
    else scheduleRender();
    if (e.kind === 'automation.check' && tab === 'health') loadHealth();
  };
}

async function loadAgents() {
  const r = await api('/api/agents');
  const names = r.ok ? await r.json() : ['claude'];
  $('agent').innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
}

$('prompt').addEventListener('keydown', async ev => {
  if (ev.key !== 'Enter') return;
  const input = ev.target;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.blur();
  await api('/api/sessions', {
    method: 'POST',
    body: JSON.stringify({ agent: $('agent').value, prompt: text }),
  });
  refresh();
});

loadAgents();
refresh();
connect();
refreshLoop = setInterval(refresh, 15000);   // backstop if the stream silently stalls
</script>
</body>
</html>
